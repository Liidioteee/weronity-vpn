[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weronity-collector"
version = "0.1.0"
description = "Weronity node-collection pipeline: scrape, decode, dedup, GeoIP, ping, classify."
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "dnspython>=2.6",
    "maxminddb>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
weronity-collector = "weronity_collector.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weronity_collector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.13"
packages = ["weronity_collector"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
