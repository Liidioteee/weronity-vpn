name: weronity
description: "Weronity — free & open cross-platform VPN client"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # storage
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  flutter_secure_storage: ^9.2.4

  # networking / data
  http: ^1.2.2

  # ui
  fl_chart: ^0.69.2
  qr_flutter: ^4.1.0

  # utils
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pool/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
